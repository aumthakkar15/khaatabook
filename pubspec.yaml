name: khaata_book
description: Khaata Book - daily expenses, accounts, cards and loans. Offline, on-device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  local_auth: ^2.3.0
  http: ^1.2.2
  excel: ^4.0.6
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  fl_chart: ^0.69.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  intl: ^0.19.0
  encrypt: ^5.0.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
