name: Build Khaata Book APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.biztras --project-name khaata_book --platforms android .
      - run: cp android_overrides/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: find android/app/src/main/kotlin -name MainActivity.kt -delete
      - run: mkdir -p android/app/src/main/kotlin/com/biztras/khaata_book
      - run: cp android_overrides/app/src/main/kotlin/com/biztras/khaata_book/MainActivity.kt android/app/src/main/kotlin/com/biztras/khaata_book/
      - run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
      - run: sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
      - run: printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk KhaataBook.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KhaataBook-APK
          path: KhaataBook.apk
